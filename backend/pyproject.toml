[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-workspace"
version = "0.1.0"
description = "Lemma — Self-Hosted AI LaTeX Workspace (OpenAI Prism Alternative)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "watchfiles>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "requires_tex: marks integration/E2E tests that require a TeX Live installation (pdflatex, synctex, tlmgr, kpsewhich)",
]
